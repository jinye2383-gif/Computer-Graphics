<text x="40" y="583" fill="#a3afbf" font-family="Microsoft YaHei,Arial" font-size="14">Ry(−θ) 抵消轨道框架的方向旋转，使地球轴保持空间指向；地球位置仍随 θ 绕太阳变化。</text></svg>
